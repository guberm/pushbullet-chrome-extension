<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pushbullet – Live Log Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Consolas', 'Menlo', monospace; font-size: 12px; background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; height: 100vh; }
        #toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #252526; border-bottom: 1px solid #3e3e42; flex-shrink: 0; flex-wrap: wrap; }
        #toolbar h1 { font-size: 14px; color: #cccccc; font-weight: 600; margin-right: 4px; }
        #filter { flex: 1; min-width: 160px; padding: 4px 8px; background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; border-radius: 3px; font-size: 12px; font-family: inherit; }
        #filter::placeholder { color: #888; }
        .btn { padding: 4px 12px; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; font-family: inherit; }
        .btn-gray  { background: #4a4a4a; color: #d4d4d4; }
        .btn-gray:hover  { background: #5a5a5a; }
        .btn-red   { background: #c0392b; color: #fff; }
        .btn-red:hover   { background: #e74c3c; }
        .btn-green { background: #27ae60; color: #fff; }
        .btn-green:hover { background: #2ecc71; }
        #auto-scroll-label { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
        #status { font-size: 11px; color: #888; white-space: nowrap; }
        #count  { font-size: 11px; color: #569cd6; white-space: nowrap; }
        #log { flex: 1; overflow-y: auto; padding: 6px 0; }
        .entry { padding: 2px 12px; line-height: 1.5; border-bottom: 1px solid #2a2a2a; white-space: pre-wrap; word-break: break-all; }
        .entry:hover { background: #2d2d2d; }
        .entry.hidden { display: none; }
        .ts { color: #6a9955; margin-right: 6px; }
        .txt { color: #d4d4d4; }
        .txt.err  { color: #f48771; }
        .txt.warn { color: #cca700; }
        .txt.info { color: #9cdcfe; }
        #empty { text-align: center; padding: 40px; color: #555; }
    </style>
</head>
<body>
    <div id="toolbar">
        <h1>📋 Live Log Viewer</h1>
        <input id="filter" type="text" placeholder="Filter logs…">
        <label id="auto-scroll-label">
            <input type="checkbox" id="auto-scroll" checked> Auto-scroll
        </label>
        <span id="count">0 entries</span>
        <span id="status">⚫ Connecting…</span>
        <button class="btn btn-gray" id="btn-download">⬇ Download</button>
        <button class="btn btn-red"  id="btn-clear">🗑 Clear</button>
    </div>
    <div id="log"><div id="empty">No logs yet. Make sure "Enable full logging" is on in Options.</div></div>

    <script src="pb.js"></script>
    <script src="utils.js"></script>
    <script src="page.js"></script>
    <script src="log-viewer.js"></script>
</body>
</html>
